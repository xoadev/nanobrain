# Same wait as the rule for every dependency: nothing younger than a week. Its commits are
# conventional (`fix(deps)`), so a new lock releases a patch of the image it touches.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - /images/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker-compose
    directory: /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    # One line per image: a glob also made a duplicate update for /images itself.
    directories:
      - /images/wyoming-whisper-gpu
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # av 19 dropped an argument faster-whisper 1.2.1 passes to av.open; 17 is the one tried since.
      - dependency-name: av
        versions: [">=18"]
      # CTranslate2 pins the pybind11 it builds with (python/install_requirements.txt): it moves with it.
      - dependency-name: pybind11
