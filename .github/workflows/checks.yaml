# Lint and image checks on every pull request, with the same make targets as a laptop.
name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, main: changed-images compares the two.
          fetch-depth: 2
      - run: make -k lint BASE=HEAD^1

  # Compiling CUDA needs nvcc, not a GPU: GitHub's arm64 runner builds the Jetson images. Only the
  # images the pull request touches; the Whisper one takes about 10 minutes.
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: make test BASE=HEAD^1 IMAGES="$(make -s changed-images BASE=HEAD^1)"
